name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "TDS identity: 24f1001300@ds.study.iitm.ac.in"
        run: 'echo "TDS identity: 24f1001300@ds.study.iitm.ac.in"'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start service
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Test release gate
        run: |
          python - <<'PY'
          import urllib.request
          import json

          payload = {
              "event": "push",
              "ref": "refs/heads/main",
              "permissions": {
                  "contents": "read",
                  "packages": "write",
                  "id-token": "none"
              },
              "testsPassed": True,
              "matrixComplete": True,
              "failFast": False,
              "actions": [
                  {
                      "owner": "actions",
                      "ref": "v4"
                  }
              ],
              "multiStage": True,
              "runsAsRoot": False,
              "secretMode": "none",
              "criticalVulnerabilities": 0,
              "digestPinned": True,
              "environmentApproval": True
          }

          req = urllib.request.Request(
              "http://127.0.0.1:8000/release-gate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          response = urllib.request.urlopen(req)
          result = json.loads(response.read())

          assert result["decision"] == "promote"
          assert result["violations"] == []
          print(result)
          PY
